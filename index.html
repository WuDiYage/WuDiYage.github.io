<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WuDiYage's Blog</title>
  <style>
    /* Self-hosted fonts — no external requests, works offline & fast in China */
    @font-face {
      font-family: 'Lora';
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url('assets/fonts/lora-600.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Lora';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url('assets/fonts/lora-700.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Noto Serif SC';
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url('assets/fonts/noto-serif-sc-600.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Noto Serif SC';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url('assets/fonts/noto-serif-sc-700.woff2') format('woff2');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --serif: "Lora", "Noto Serif SC", "Songti SC", "SimSun", "STSong", serif;
      --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
      --ink: #0e1626;
      --ink-deep: #0a101c;
      --line: rgba(255, 255, 255, 0.08);
      --gold: #e6c07b;
      --text: #e8e6e1;
      --body: #c8ced6;
      --dim: #96a0b2;
      --faint: #6b7280;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, "Microsoft YaHei", sans-serif;
      background: #0b1220 url("./8K.png") center / cover no-repeat fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Starfall — from Rain.html */
    .starfall {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      opacity: 0.7;
    }
    .starfall span {
      position: absolute;
      top: -50px;
      width: 2px;
      height: 2px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 6px #fff, 0 0 12px rgba(180, 210, 255, 0.6);
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% { transform: translate3d(0, 0, 0); opacity: 1; }
      100% { transform: translate3d(-100px, 100vh, 0); opacity: 0; }
    }
    .starfall span:nth-child(1)  { left: 10%; animation-duration: 8s;   animation-delay: 0s; }
    .starfall span:nth-child(2)  { left: 20%; animation-duration: 10s;  animation-delay: 1s; }
    .starfall span:nth-child(3)  { left: 30%; animation-duration: 7s;   animation-delay: 2s; }
    .starfall span:nth-child(4)  { left: 40%; animation-duration: 12s;  animation-delay: 0.5s; }
    .starfall span:nth-child(5)  { left: 50%; animation-duration: 9s;   animation-delay: 3s; }
    .starfall span:nth-child(6)  { left: 60%; animation-duration: 11s;  animation-delay: 1.2s; }
    .starfall span:nth-child(7)  { left: 70%; animation-duration: 8.5s; animation-delay: 2.1s; }
    .starfall span:nth-child(8)  { left: 80%; animation-duration: 9.5s; animation-delay: 0.8s; }
    .starfall span:nth-child(9)  { left: 90%; animation-duration: 10.5s;animation-delay: 1.5s; }
    .starfall span:nth-child(10) { left: 5%;  animation-duration: 7.5s; animation-delay: 2.5s; }
    .starfall span:nth-child(11) { left: 15%; animation-duration: 9.2s; animation-delay: 0.3s; }
    .starfall span:nth-child(12) { left: 25%; animation-duration: 11.5s;animation-delay: 1.8s; }
    .starfall span:nth-child(13) { left: 35%; animation-duration: 8.2s; animation-delay: 2.8s; }
    .starfall span:nth-child(14) { left: 55%; animation-duration: 10.8s;animation-delay: 0.6s; }
    .starfall span:nth-child(15) { left: 75%; animation-duration: 7.8s; animation-delay: 3.2s; }
    .starfall span:nth-child(16) { left: 85%; animation-duration: 9.8s; animation-delay: 1.1s; }

    header, main, footer { position: relative; z-index: 1; }
    header {
      background: rgba(10, 16, 28, 0.72);
      color: var(--text);
      padding: 2.25rem 2rem;
      text-align: center;
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--line);
    }
    header h1 { font-family: var(--serif); font-size: 2rem; margin-bottom: 0.5rem; letter-spacing: 0.02em; }
    header h1::after {
      content: ""; display: block; width: 2.5rem; height: 1px;
      background: var(--gold); margin: 0.75rem auto 0;
    }
    header p { color: var(--dim); font-size: 0.95rem; }
    .topnav {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .topnav .tab {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--dim);
      padding: 0.5rem 1.75rem;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 4px;
      font-family: inherit;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .topnav .tab:hover {
      color: var(--gold);
      border-color: var(--gold);
    }
    .topnav .tab.active {
      color: var(--gold);
      border-color: var(--gold);
      background: rgba(230, 192, 123, 0.08);
    }
    .fate-panel {
      flex: 1;
      max-width: 100%;
      margin: 0;
      padding: 0;
    }
    .fate-panel iframe {
      width: 100%;
      height: calc(100vh - 170px);
      min-height: 480px;
      border: none;
      display: block;
      background: #0b1220;
    }
    main { flex: 1; max-width: 800px; margin: 2rem auto; padding: 0 1rem; width: 100%; }
    .card {
      background: rgba(14, 22, 38, 0.92);
      border: 1px solid var(--line);
      border-left: 2px solid rgba(230, 192, 123, 0.4);
      border-radius: 6px;
      padding: 1.5rem 1.75rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .card:hover {
      border-color: rgba(230, 192, 123, 0.45);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(230, 192, 123, 0.15);
    }
    .card h2 { font-size: 1.35rem; margin-bottom: 0.4rem; }
    .card h2 a { color: var(--text); text-decoration: none; font-family: var(--serif); font-weight: 600; }
    .card h2 a:hover { color: var(--gold); }
    .card .date { color: var(--faint); font-family: var(--mono); font-size: 0.8rem; margin-bottom: 0.75rem; }
    .card .date::before { content: "✦ "; color: var(--gold); }
    .card p { color: var(--body); line-height: 1.7; }
    footer {
      background: rgba(10, 16, 28, 0.72);
      color: var(--faint);
      text-align: center;
      padding: 1.5rem;
      font-size: 0.85rem;
      backdrop-filter: blur(6px);
      border-top: 1px solid var(--line);
    }
    footer a { color: var(--gold); text-decoration: none; }
  </style>
</head>
<body>

<div class="starfall" aria-hidden="true">
  <span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span>
</div>

<header>
  <nav class="topnav">
    <button class="tab active" data-tab="articles" type="button">文章</button>
    <button class="tab" data-tab="fate" type="button">算命</button>
  </nav>
  <h1>WuDiYage's Blog</h1>
  <p>Welcome to my digital garden 🌱</p>
</header>

<main id="tab-articles">
  <div class="card">
    <h2><a href="./2026/10/15/understand-ai/index.html">从零了解AI(专业向非科普向)</a></h2>
    <p class="date">2026-10-15</p>
    <p>从函数拟合讲到 Transformer 与大模型，建立一套专业向的认知框架。</p>
  </div>

  <div class="card">
    <h2><a href="./2026/03/26/adjust-image-tone-clarity/index.html">AI的SKILL是什么</a></h2>
    <p class="date">2026-10-15</p>
    <p>理清提示词、系统提示词、Skill 与 MCP 的关系，以及 Skill 的标准格式。</p>
  </div>

  <div class="card">
    <h2><a href="./2026/03/26/hello-world/index.html">Hello World</a></h2>
    <p class="date">0-0-0</p>
    <p>Hello World.</p>
  </div>
</main>

<main id="tab-fate" class="fate-panel" hidden>
  <iframe title="算命"></iframe>
</main>

<footer>
  <p>Powered by <a href="https://pages.github.com/">GitHub Pages</a></p>
</footer>

<!-- 顶部导航：文章 / 算命 -->
<script>
  (function () {
    const tabs = document.querySelectorAll(".topnav .tab");
    const articles = document.getElementById("tab-articles");
    const fate = document.getElementById("tab-fate");
    const frame = fate ? fate.querySelector("iframe") : null;
    tabs.forEach((btn) => {
      btn.addEventListener("click", () => {
        tabs.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const name = btn.dataset.tab;
        articles.hidden = name !== "articles";
        fate.hidden = name !== "fate";
        if (name === "fate" && frame && !frame.getAttribute("src")) {
          frame.src = "./Fate/web/index.html";
        }
      });
    });
  })();
</script>

<!-- live2d 看板娘 -->
<script src="./live2d-waifu/autoload.js"></script>

</body>
</html>
