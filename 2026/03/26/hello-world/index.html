<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World - WuDiYage's Blog</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #0b1220 url("../../../../8K.png") center / cover no-repeat fixed;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Starfall — from Rain.html */
    .starfall {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      opacity: 0.7;
    }
    .starfall span {
      position: absolute;
      top: -50px;
      width: 2px;
      height: 2px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 6px #fff, 0 0 12px rgba(180, 210, 255, 0.6);
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% { transform: translate3d(0, 0, 0); opacity: 1; }
      100% { transform: translate3d(-100px, 100vh, 0); opacity: 0; }
    }
    .starfall span:nth-child(1)  { left: 10%; animation-duration: 8s;   animation-delay: 0s; }
    .starfall span:nth-child(2)  { left: 20%; animation-duration: 10s;  animation-delay: 1s; }
    .starfall span:nth-child(3)  { left: 30%; animation-duration: 7s;   animation-delay: 2s; }
    .starfall span:nth-child(4)  { left: 40%; animation-duration: 12s;  animation-delay: 0.5s; }
    .starfall span:nth-child(5)  { left: 50%; animation-duration: 9s;   animation-delay: 3s; }
    .starfall span:nth-child(6)  { left: 60%; animation-duration: 11s;  animation-delay: 1.2s; }
    .starfall span:nth-child(7)  { left: 70%; animation-duration: 8.5s; animation-delay: 2.1s; }
    .starfall span:nth-child(8)  { left: 80%; animation-duration: 9.5s; animation-delay: 0.8s; }
    .starfall span:nth-child(9)  { left: 90%; animation-duration: 10.5s;animation-delay: 1.5s; }
    .starfall span:nth-child(10) { left: 5%;  animation-duration: 7.5s; animation-delay: 2.5s; }
    .starfall span:nth-child(11) { left: 15%; animation-duration: 9.2s; animation-delay: 0.3s; }
    .starfall span:nth-child(12) { left: 25%; animation-duration: 11.5s;animation-delay: 1.8s; }
    .starfall span:nth-child(13) { left: 35%; animation-duration: 8.2s; animation-delay: 2.8s; }
    .starfall span:nth-child(14) { left: 55%; animation-duration: 10.8s;animation-delay: 0.6s; }
    .starfall span:nth-child(15) { left: 75%; animation-duration: 7.8s; animation-delay: 3.2s; }
    .starfall span:nth-child(16) { left: 85%; animation-duration: 9.8s; animation-delay: 1.1s; }

    .back-link { display: inline-block; color: #3498db; text-decoration: none; font-size: 0.9rem; }
    .back-link:hover { text-decoration: underline; }
    footer { position: relative; z-index: 1; text-align: center; padding: 1.5rem; margin-top: auto; }
  </style>
</head>
<body>

<div class="starfall" aria-hidden="true">
  <span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span>
</div>

<footer>
  <a class="back-link" href="../../../../index.html">← 返回首页</a>
</footer>

</body>
</html>
