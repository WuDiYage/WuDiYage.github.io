<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16302B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="择日">
  <title>择日</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./app.css?v=both">
</head>
<body>
  <div class="phone">
    <header class="mast">
      <h1>择日</h1>
      <p>通书和八字可以分开算，也可以一起算。不是科学预测。</p>
    </header>

    <form id="sheet" class="sheet">
      <p class="hint">勾选要算的算法。要排的日子只填一次。两个都选时，同一天按通书分加八字分从高到低排，两套分数分开显示。</p>
      <div class="checks">
        <label class="check"><input id="use-almanac" type="checkbox" checked>通书</label>
        <label class="check"><input id="use-bazi" type="checkbox" checked>八字</label>
      </div>
      <p class="section-label">要排的日子</p>
      <div class="pair">
        <label>公历年
          <input id="g_year" inputmode="numeric" value="2026" required>
        </label>
        <label>公历月
          <input id="g_month" inputmode="numeric" value="10" required>
        </label>
      </div>
      <div class="pair">
        <label>公历日
          <input id="g_day" inputmode="numeric" placeholder="不填则排整月">
        </label>
        <label>时间
          <select id="time">
            <option value="" selected>不填</option>
            <option>00:00</option><option>00:30</option>
            <option>01:00</option><option>01:30</option>
            <option>02:00</option><option>02:30</option>
            <option>03:00</option><option>03:30</option>
            <option>04:00</option><option>04:30</option>
            <option>05:00</option><option>05:30</option>
            <option>06:00</option><option>06:30</option>
            <option>07:00</option><option>07:30</option>
            <option>08:00</option><option>08:30</option>
            <option>09:00</option><option>09:30</option>
            <option>10:00</option><option>10:30</option>
            <option>11:00</option><option>11:30</option>
            <option>12:00</option><option>12:30</option>
            <option>13:00</option><option>13:30</option>
            <option>14:00</option><option>14:30</option>
            <option>15:00</option><option>15:30</option>
            <option>16:00</option><option>16:30</option>
            <option>17:00</option><option>17:30</option>
            <option>18:00</option><option>18:30</option>
            <option>19:00</option><option>19:30</option>
            <option>20:00</option><option>20:30</option>
            <option>21:00</option><option>21:30</option>
            <option>22:00</option><option>22:30</option>
            <option>23:00</option><option>23:30</option>
          </select>
        </label>
      </div>
      <div class="pair">
        <label>事项
          <select id="event_type">
            <option value="marry" selected>嫁娶</option>
            <option value="open">开市</option>
            <option value="earth">动土</option>
            <option value="travel">出行</option>
          </select>
        </label>
        <label>房屋坐向
          <input id="house_dir" value="坐北朝南" placeholder="坐北朝南">
        </label>
      </div>
      <p class="section-label">通书</p>
      <label class="full">生肖
        <select id="zhushi_shengxiao">
          <option>鼠</option><option>牛</option><option>虎</option><option>兔</option>
          <option>龙</option><option>蛇</option><option>马</option><option>羊</option>
          <option>猴</option><option>鸡</option><option selected>狗</option><option>猪</option>
        </select>
      </label>
      <p class="section-label">八字</p>
      <div class="pair">
        <label>出生年
          <input id="birth_year" inputmode="numeric" placeholder="1990">
        </label>
        <label>出生月
          <input id="birth_month" inputmode="numeric" placeholder="5">
        </label>
      </div>
      <div class="pair">
        <label>出生日
          <input id="birth_day" inputmode="numeric" placeholder="15">
        </label>
        <label>出生时间
          <select id="birth_time"></select>
        </label>
      </div>
      <label class="full">性别
        <select id="gender">
          <option value="" selected>请选择</option>
          <option value="男">男</option>
          <option value="女">女</option>
        </select>
      </label>
      <p id="form-error" class="form-error" hidden></p>
      <button id="calc" type="button">算命</button>
    </form>

    <section id="result" class="result" hidden>
      <p id="headline" class="headline"></p>
      <div class="fold-bar">
        <button id="open-all" type="button">一键展开</button>
        <button id="close-all" type="button">一键折叠</button>
      </div>
      <div class="cols" id="cols" aria-hidden="true">
        <span>日期</span>
        <span>最佳</span>
        <span>通书</span>
        <span>八字</span>
      </div>
      <div id="list"></div>
    </section>
  </div>
  <script src="./lunar.js"></script>
  <script src="./fate.js"></script>
  <script src="./app.js?v=both"></script>
</body>
</html>
